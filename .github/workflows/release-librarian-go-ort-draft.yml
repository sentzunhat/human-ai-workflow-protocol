name: "[DRAFT] Build ONNX-ORT variant binaries"

# UNTESTED DRAFT — manual-dispatch only, not wired to any tag push. Nothing
# in this file runs automatically; it exists for review before deciding
# whether/how to fold it into release-librarian-go.yml.
#
# What this builds and why it's a SEPARATE workflow, not a modification of
# the real release pipeline:
#
# The real release (release-librarian-go.yml) builds all 6 platforms from
# one ubuntu-latest runner via pure Go cross-compilation (CGO_ENABLED=0,
# `make dist`) — simple, fast, no native dependencies, and it's the
# actually-working release process today. Adding ONNX LLM (the "ORT"
# backend) needs CGO_ENABLED=1 plus three native libraries per platform
# (libonnxruntime, libonnxruntime-genai, libtokenizers — see
# librarian/docs/v0.1.0_VISION.md's "ONNX Text2Text Model" section for the
# full story of getting this working locally), which breaks pure
# cross-compilation entirely: CGO builds must run on a NATIVE runner per
# target platform, not cross-compiled from one Linux box.
#
# Coverage is NOT all 6 platforms. Checked directly against upstream release
# assets (2026-07-27):
#   - darwin/arm64  — all 3 libs have official prebuilt releases. Covered.
#   - linux/amd64   — all 3 libs have official prebuilt releases. Covered.
#   - linux/arm64   — all 3 libs have official prebuilt releases. Covered.
#   - darwin/amd64  (Intel Mac) — Microsoft publishes NO official
#     onnxruntime or onnxruntime-genai build for this platform at all, and
#     GitHub is retiring Intel Mac hosted runners entirely by Aug 2027
#     (see github.blog/changelog/2025-09-19-github-actions-macos-13-runner-image-is-closing-down).
#     Deliberately NOT attempted — building from source for a platform both
#     Apple and GitHub are winding down is not a good use of effort.
#   - windows/amd64, windows/arm64 — daulet/tokenizers (the ONLY source of
#     libtokenizers) publishes NO Windows build at all — checked directly
#     against https://api.github.com/repos/daulet/tokenizers/releases/latest,
#     Linux/macOS only. Getting Windows working would mean building
#     tokenizers from source via Rust/Cargo ourselves (it's a Rust project;
#     plausible but a separate, unverified effort — no Windows runner or
#     Rust toolchain wired up here). NOT attempted in this draft.
#
# Output: hawp-<os>-<arch>-ort binaries, meant to be uploaded as ADDITIONAL
# release assets alongside the existing plain hawp-<os>-<arch> binaries —
# NOT a replacement. Bundling 3 native libraries makes these binaries much
# larger (~100MB+ vs a few MB for the pure-Go build), so most users (Ollama
# for LLM, which needs none of this) should keep getting the small plain
# binary; the -ort variant is opt-in for users who specifically want local
# ONNX-based text generation.
#
# NOT YET DONE in this draft, left for whoever picks this up:
#   - Wiring this into release-librarian-go.yml's actual release upload
#     (would need a shared "resolve version" job both workflows depend on,
#     or moving these jobs directly into that file).
#   - Verifying the linux/arm64 hosted runner label below (`ubuntu-24.04-arm`)
#     is still current — GitHub's ARM Linux runner labels have changed
#     before and may again.
#   - Any actual test run — this has never been executed. Everything here
#     is inference from the local macOS arm64 build that WAS verified
#     working (see v0.1.0_VISION.md), generalized to the other 2 platforms
#     without being run.
#   - CGO_LDFLAGS rpath handling likely needs adjustment per-OS (macOS uses
#     -Wl,-rpath; Linux typically wants -Wl,-rpath,'$ORIGIN' plus an
#     RPATH/RUNPATH consideration, or bundling libs alongside the binary
#     and setting LD_LIBRARY_PATH at runtime instead — not resolved here).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string to bake into the binary (e.g. 0.1.0-ort-test); does not create a release or tag"
        required: true

permissions:
  contents: read

jobs:
  build-ort-variant:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_name: darwin-arm64
            goos: darwin
            goarch: arm64
            os: macos-latest
            onnxruntime_asset: onnxruntime-osx-arm64-1.28.0.tgz
            genai_asset: onnxruntime-genai-0.14.0-osx-arm64.tar.gz
            tokenizers_asset: libtokenizers.darwin-arm64.tar.gz
            lib_ext: dylib
          - platform_name: linux-amd64
            goos: linux
            goarch: amd64
            os: ubuntu-latest
            onnxruntime_asset: onnxruntime-linux-x64-1.28.0.tgz
            genai_asset: onnxruntime-genai-0.14.0-linux-x64.tar.gz
            tokenizers_asset: libtokenizers.linux-x86_64.tar.gz
            lib_ext: so
          - platform_name: linux-arm64
            goos: linux
            goarch: arm64
            # NOT VERIFIED: confirm this label is current in GitHub's
            # hosted-runner docs before actually running this job.
            os: ubuntu-24.04-arm
            onnxruntime_asset: onnxruntime-linux-aarch64-1.28.0.tgz
            genai_asset: onnxruntime-genai-0.14.0-linux-arm64.tar.gz
            tokenizers_asset: libtokenizers.linux-aarch64.tar.gz
            lib_ext: so

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Fetch native libraries (onnxruntime, onnxruntime-genai, tokenizers)
        run: |
          set -e
          mkdir -p native/lib native/include
          cd native

          curl -sL -o ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v1.28.0/${{ matrix.onnxruntime_asset }}"
          tar -xzf ort.tgz
          ORT_DIR=$(find . -maxdepth 1 -iname "onnxruntime-*" -type d | head -1)
          cp "$ORT_DIR"/lib/*.${{ matrix.lib_ext }}* lib/ 2>/dev/null || true
          cp "$ORT_DIR"/include/*.h include/

          curl -sL -o genai.tgz "https://github.com/microsoft/onnxruntime-genai/releases/download/v0.14.0/${{ matrix.genai_asset }}"
          mkdir genai && tar -xzf genai.tgz -C genai
          GENAI_DIR=$(find genai -maxdepth 1 -mindepth 1 -type d | head -1)
          cp "$GENAI_DIR"/lib/*.${{ matrix.lib_ext }}* lib/ 2>/dev/null || true
          cp "$GENAI_DIR"/include/*.h include/

          curl -sL -o tok.tgz "https://github.com/daulet/tokenizers/releases/download/v1.27.0/${{ matrix.tokenizers_asset }}"
          mkdir tok && tar -xzf tok.tgz -C tok
          find tok -iname "libtokenizers.a" -exec cp {} lib/ \;

          ls -la lib/ include/

      - name: Build ORT-enabled binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          # NOT VERIFIED cross-platform: this rpath form is confirmed working
          # on macOS (librarian/docs/v0.1.0_VISION.md). Linux likely needs
          # $ORIGIN-relative rpath instead if the binary and libs ship
          # together, rather than an absolute build-time path.
          CGO_CFLAGS: "-I${{ github.workspace }}/native/include"
          CGO_LDFLAGS: "-L${{ github.workspace }}/native/lib -Wl,-rpath,${{ github.workspace }}/native/lib -lonnxruntime -lonnxruntime-genai -ltokenizers -ldl -lm -lstdc++"
        working-directory: librarian/go
        run: |
          go build -tags ORT -trimpath \
            -ldflags="-s -w -X 'github.com/sentzunhat/hawp/librarian/go/internal/domain/update.Version=v${{ github.event.inputs.version }}'" \
            -o "bin/hawp-${{ matrix.platform_name }}-ort" ./cmd/hawp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hawp-${{ matrix.platform_name }}-ort
          path: librarian/go/bin/hawp-${{ matrix.platform_name }}-ort
