name: Quality

on:
    push:
        branches:
            - main
            - development
        paths:
            - librarian/**
            - .hawp/work/**
            - .github/workflows/quality.yml
    pull_request:
        branches:
            - main
            - development
        paths:
            - librarian/**
            - .hawp/work/**
            - .github/workflows/quality.yml

jobs:
    quality:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: librarian/src/go.mod
                  cache-dependency-path: librarian/src/go.sum

            - name: Build and install hawp binary
              run: make install
              working-directory: librarian/src

            - name: Go vet
              run: go vet ./...
              working-directory: librarian/src

            - name: Go tests
              run: go test ./...
              working-directory: librarian/src

            - name: Validate HAWP workflow state
              run: go run ./cmd/hawp work validate
              working-directory: librarian/src
