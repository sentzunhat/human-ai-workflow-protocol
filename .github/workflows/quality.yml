name: Quality

on:
    push:
        branches:
            - main
            - development
        paths:
            - librarian/**
            - .hawp/work/**
            - .nvmrc
            - .github/workflows/quality.yml
    pull_request:
        branches:
            - main
            - development
        paths:
            - librarian/**
            - .hawp/work/**
            - .nvmrc
            - .github/workflows/quality.yml

jobs:
    quality:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: librarian/src/go.mod
                  cache-dependency-path: librarian/src/go.sum

            - name: Build hawp binary
              run: make build
              working-directory: librarian/src

            - name: Install hawp binary to .hawp/bin
              run: |
                  mkdir -p .hawp/bin
                  cp librarian/src/bin/hawp .hawp/bin/hawp
                  chmod +x .hawp/bin/hawp

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: librarian/package-lock.json

            - name: Show Node and npm versions
              run: node -v && npm -v

            - name: Install librarian dependencies
              run: npm ci
              working-directory: librarian

            - name: Typecheck
              run: npm run typecheck
              working-directory: librarian

            - name: Unit tests
              run: npm test
              working-directory: librarian

            - name: Validate HAWP workflow state
              run: npm run work:validate
              working-directory: librarian
