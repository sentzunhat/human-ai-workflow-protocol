name: Quality

on:
    push:
        branches:
            - main
            - development
        paths:
            - librarian/**
            - .hawp/work/**
            - .github/workflows/quality.yml
    pull_request:
        branches:
            - main
            - development
        paths:
            - librarian/**
            - .hawp/work/**
            - .github/workflows/quality.yml

jobs:
    quality:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: librarian/src/go.mod
                  cache-dependency-path: librarian/src/go.sum

            - name: Build and install hawp binary
              run: make install
              working-directory: librarian/src

            - name: Check Go formatting
              shell: bash
              run: |
                  set -euo pipefail
                  go_files=()
                  while IFS= read -r -d '' file; do
                      go_files+=("${file}")
                  done < <(git ls-files -z -- 'librarian/src/*.go' 'librarian/src/**/*.go')
                  formatted=""
                  if ((${#go_files[@]} > 0)); then
                      formatted="$(gofmt -l "${go_files[@]}")"
                  fi
                  if [[ -n "${formatted}" ]]; then
                      echo "The following Go files are not gofmt-formatted:"
                      printf '%s\n' "${formatted}"
                      exit 1
                  fi

            - name: Check branch diff hygiene
              shell: bash
              run: |
                  set -euo pipefail
                  if [[ "${{ github.event_name }}" == "pull_request" ]]; then
                      base_ref="${{ github.event.pull_request.base.sha }}"
                      base="$(git merge-base "${base_ref}" "${{ github.sha }}")"
                  else
                      base="${{ github.event.before }}"
                  fi
                  if [[ "${base}" == "0000000000000000000000000000000000000000" ]]; then
                      base="$(git rev-list --max-parents=0 "${{ github.sha }}" | head -n1)"
                  fi
                  git diff --check "${base}" "${{ github.sha }}"

            - name: Go vet
              run: go vet ./...
              working-directory: librarian/src

            - name: Go tests
              run: go test ./...
              working-directory: librarian/src

            - name: Validate HAWP workflow state
              run: go run ./cmd/hawp work validate
              working-directory: librarian/src
