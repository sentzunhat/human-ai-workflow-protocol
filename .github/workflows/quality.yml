name: Quality

on:
    push:
        branches:
            - main
            - development
        paths:
            - librarian/**
            - .hawp/work/**
            - .github/workflows/quality.yml
    pull_request:
        branches:
            - main
            - development
        paths:
            - librarian/**
            - .hawp/work/**
            - .github/workflows/quality.yml

jobs:
    quality:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: librarian/src/go.mod
                  cache-dependency-path: librarian/src/go.sum

            - name: Build hawp binary
              run: make build
              working-directory: librarian/src

            - name: Install hawp binary to .hawp/bin
              run: |
                  mkdir -p .hawp/bin
                  cp librarian/src/bin/hawp .hawp/bin/hawp
                  chmod +x .hawp/bin/hawp

            - name: Go tests
              run: go test ./...
              working-directory: librarian/src

            - name: Validate HAWP workflow state
              run: go run ./cmd/hawp work validate
              working-directory: librarian/src
