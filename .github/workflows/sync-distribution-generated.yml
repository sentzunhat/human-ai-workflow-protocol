name: Validate Distribution Generated

on:
    push:
        branches:
            - main
            - development
        paths:
            - distribution/sources/**
            - distribution/generated/**
            - core/providers/shared/**
            - librarian/src/internal/application/distribution/**
            - librarian/src/internal/application/providersync/**
            - librarian/src/internal/domain/distribution/**
            - librarian/src/internal/domain/providersync/**
            - librarian/src/internal/platform/cli/**
            - README.md
            - .github/workflows/sync-distribution-generated.yml
    pull_request:
        branches:
            - main
            - development
        paths:
            - distribution/sources/**
            - distribution/generated/**
            - core/providers/shared/**
            - librarian/src/internal/application/distribution/**
            - librarian/src/internal/application/providersync/**
            - librarian/src/internal/domain/distribution/**
            - librarian/src/internal/domain/providersync/**
            - librarian/src/internal/platform/cli/**
            - README.md
            - .github/workflows/sync-distribution-generated.yml

jobs:
    validate-generated:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: librarian/src/go.mod
                  cache-dependency-path: librarian/src/go.sum

            - name: Sync generated distribution guides
              run: go run ./cmd/hawp distribution sync
              working-directory: librarian/src

            - name: Fail on generated drift
              run: |
                  if git diff --quiet -- distribution/generated core/providers/.github/instructions core/providers/.cursor/rules core/providers/.continue/rules; then
                    echo "Generated distribution guides and materialized provider overlays are current"
                    exit 0
                  fi

                  echo "Generated outputs are stale. Run 'cd librarian/src && go run ./cmd/hawp distribution sync' and commit the updates."
                  git --no-pager diff -- distribution/generated core/providers/.github/instructions core/providers/.cursor/rules core/providers/.continue/rules
                  exit 1
