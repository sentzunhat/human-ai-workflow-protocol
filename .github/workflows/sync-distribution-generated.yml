name: Validate Distribution Generated

on:
    push:
        branches:
            - main
            - dev
        paths:
            - distribution/sources/**
            - librarian/scripts/distribution/**
            - librarian/package.json
            - README.md
            - .github/workflows/sync-distribution-generated.yml
    pull_request:
        branches:
            - main
            - dev
        paths:
            - distribution/sources/**
            - librarian/scripts/distribution/**
            - librarian/package.json
            - README.md
            - .github/workflows/sync-distribution-generated.yml

jobs:
    validate-generated:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: npm
                  cache-dependency-path: librarian/package-lock.json

            - name: Install librarian dependencies
              run: npm ci
              working-directory: librarian

            - name: Sync generated distribution guides
              run: npm run distribution:sync
              working-directory: librarian

            - name: Fail on generated drift
              run: |
                  if git diff --quiet -- distribution/generated; then
                    echo "Generated distribution guides are current"
                    exit 0
                  fi

                  echo "Generated distribution guides are stale. Run 'npm --prefix librarian run distribution:sync' and update the generated files in your branch."
                  git --no-pager diff -- distribution/generated
                  exit 1
